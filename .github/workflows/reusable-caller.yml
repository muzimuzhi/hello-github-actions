name: reusable caller

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  caller-job:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest]
    name: Caller
    uses: ./.github/workflows/reusable-callee.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      is-workflow_call: true
