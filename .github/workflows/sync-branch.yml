name: Sync branch

permissions:
  contents: write

on:
  push:
    branches:
      - 'main'

env:
  # just in case I'm hesitant about its name
  base_branch: base

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync ${{ env.base_branch }} branch with main
        # syntax: <source>:<destination>
        run: |
          git push -f origin main:${{ env.base_branch }}

      # run `cd "$GITHUB_WORKSPACE" && touch continue` to continue
      # https://github.com/owenthereal/action-upterm#continue-a-workflow
      - name: Debug with SSH
        if: failure()
        uses: owenthereal/action-upterm@v2
        with:
          wait-timeout-minutes: 5
