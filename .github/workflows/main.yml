name: Hello World workflow

on:
  push:
    paths: &paths
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - 'main'
    paths: *paths
    types:
      # added "ready_for_review" activity type
      # all activity types of "pull_request" event
      # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request
      # on.<event_name>.types
      # https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onevent_nametypes
      [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/action-a
        with:
          MY_NAME: "Mona"

      # run `cd "$GITHUB_WORKSPACE" && touch continue` to continue
      # https://github.com/owenthereal/action-upterm#continue-a-workflow
      - name: Debug with SSH
        if: failure()
        uses: owenthereal/action-upterm@v2
        with:
          wait-timeout-minutes: 5
